on:
  push:
    branches:
      - master
      - test

name: Release

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'master' && 'production' || 'test' }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Cache dependencies
        id: cache
        uses: actions/cache@v4
        with:
          path: ./node_modules
          key: modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts

      - name: Type-check
        run: npm run type-check

      - name: Test
        run: npm test

      - name: Build Javascript
        run: npm run build

      # pika emits files: ["dist-*/"] which modern npm no longer matches,
      # producing a tarball with only the main entrypoint. pkg/ contains
      # nothing but build output, so drop the field and include everything.
      - name: Remove broken files glob from pkg/package.json
        run: node -e "const fs=require('fs');const p='./pkg/package.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));delete j.files;fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')"

      - name: Publish package to npm
        run: npm publish ./pkg --access public --provenance --tag ${{ github.ref_name == 'master' && 'latest' || 'next' }}
